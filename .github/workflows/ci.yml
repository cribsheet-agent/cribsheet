name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check.mjs
      - run: node scripts/embed.mjs --check
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p worker
      - run: node --test 'test/*.test.ts'

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1.9.2
      - run: forge build --sizes
      - run: forge test -vv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          fail-on: medium
